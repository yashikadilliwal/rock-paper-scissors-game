<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Papper Scissor Game </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <p id="heading"> ROCK PAPPER SCISSOR GAME</p>
    </header>
    <div id="choices">
        <div class="choice" id="rock">
            <img src="img/rock-removebg-preview.png">
        </div>
        <div class="choice" id="papper">
            <img src="img/paper-removebg-preview.png">
        </div>
        <div class="choice" id="scissor">
            <img src="img/scissors-removebg-preview.png">
        </div>
    </div>
    <div id="score-board">
        <div class="score">
            <p id="user">0</p>
            <p >You</p>
        </div>
        <div class="score">
            <p id="computer">0</p>
            <p >Computer</p>
        </div>

    </div>
        
    <div id="who-wins">
        <p id="msg"> Let's Start</p>
    </div>

    <button id="reset">Play Again</button>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
</body>
</html>
